[package]
build = "build.rs"
name = "launcherlauncher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Cross-platform launcher-launcher: backs up, patches and starts PCL2 / HMCL / PCL2-CE"
license = "MIT"

[features]
default = []
console = []

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = "0.37.0"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
cpal = "0.15.3"
sha2 = "0.10.9"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

