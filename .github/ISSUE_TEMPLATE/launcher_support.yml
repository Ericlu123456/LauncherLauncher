name: 启动器支持请求
description: 请求识别新的启动器、包装器或发行格式。
title: "[launcher] "
labels: ["launcher-support"]
body:
  - type: markdown
    attributes:
      value: |
        如果当前规则没有覆盖你的启动器，可以用这个表单。
        不要附启动器本体；提供 SHA-256 和简短描述即可。
  - type: input
    id: name
    attributes:
      label: 启动器名称
      placeholder: 例如 MyLauncher
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 构建
      placeholder: 例如 1.2.3 stable，Windows x64
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: 文件类型与布局
      placeholder: 例如 .jar；.exe + 外置 jar；.NET single-file；原生镜像；Electron
    validations:
      required: true
  - type: input
    id: hash
    attributes:
      label: 测试文件的 SHA-256
      placeholder: 64 位十六进制
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 希望工具做什么？
      description: 描述希望保留的页面、按钮或行为；不要贴账号数据。
    validations:
      required: true
  - type: textarea
    id: inspect
    attributes:
      label: `--inspect` 输出
      description: 运行 `launcherlauncher --inspect <文件>` 并粘贴结果。
      render: shell
    validations:
      required: false
  - type: dropdown
    id: willingness
    attributes:
      label: 是否愿意协助测试？
      options:
        - "愿意，Windows"
        - "愿意，Linux"
        - "愿意，macOS"
        - "不测试，只提交报告"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我没有上传启动器本体、游戏文件或账号数据。
          required: true
        - label: 我有权测试和修改这个启动器。
          required: true
